name: ML Pipeline

on: workflow_dispatch

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python src.train.py

      - name: Build Docker image
        run: docker build -t cancer-api .
